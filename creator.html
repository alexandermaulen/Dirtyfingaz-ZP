function draw(){let w=Math.max(1,Math.floor(canvas.clientWidth*2)),h=Math.max(1,Math.floor(canvas.clientHeight*2));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}let x=canvas.getContext("2d");x.clearRect(0,0,w,h);let sample=activeTab==="RECORTE"?samples[activePad]:null;if(sample){let r=ranges[activePad]||{start:0,end:1},data=sample.getChannelData(0),stride=Math.max(1,Math.floor(data.length/w));x.fillStyle="#174c12";x.fillRect(0,0,w,h);x.strokeStyle="#d8ff4f";x.lineWidth=2;x.beginPath();for(let i=0;i<w;i++){let min=1,max=-1,from=i*stride,to=Math.min(data.length,from+stride);for(let j=from;j<to;j++){min=Math.min(min,data[j]);max=Math.max(max,data[j])}let y1=h*(.5-max*.46),y2=h*(.5-min*.46);x.moveTo(i,y1);x.lineTo(i,y2)}x.stroke();x.fillStyle="#ff252555";x.fillRect(0,0,w*r.start,h);x.fillRect(w*r.end,0,w*(1-r.end),h);x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.moveTo(w*r.start,0);x.lineTo(w*r.start,h);x.moveTo(w*r.end,0);x.lineTo(w*r.end,h);x.stroke();x.fillStyle="#fff";x.font="bold 18px monospace";x.fillText("IN",Math.max(2,w*r.start+3),15);x.fillText("OUT",Math.min(w-38,w*r.end+3),15)}else{x.strokeStyle="#d8ff4f";x.lineWidth=2;if(analyser){let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);x.beginPath();for(let i=0;i<w;i++){let yy=h/2+(data[Math.floor(i/w*data.length)]-128)/128*h*.42;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}else{x.beginPath();for(let i=0;i<w;i++){let yy=h/2+Math.sin(i*.05)*Math.sin(i*.013)*h*.2;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}}requestAnimationFrame(draw)}
