function updateValueReadout(){if(valueOutput){let r=ranges[activePad]||{start:0,end:1};valueOutput.textContent=Math.round(r[valueTarget]*100)+"%";if(valueTargetLabel)valueTargetLabel.textContent=(activeTab==="RECORTE"?"RECORTE · "+(valueTarget==="start"?"IN":"OUT"):systemMenu?"SYSTEM MENU":"FX CONTROL");}}
function changeValue(delta){
 if(systemMenu){let max=(menuPage==="MAIN"?5:4)-1;menuIndex=(menuIndex+delta+max+1)%(max+1);updateScreen();return}
 if(activeTab==="RECORTE"&&samples[activePad]){let r=ranges[activePad]||{start:0,end:1};setTrimValue(valueTarget,r[valueTarget]+delta*.0025);updateValueReadout();return}
 if(activeTab==="EFECTOS"){fxAmount=Math.max(0,Math.min(1,fxAmount+delta*.01));applyFxAmount();return}
}
function applyFxAmount(){if(!ctx){fxValueOutput.textContent=Math.round(fxAmount*100)+"%";if(fxReadout)fxReadout.innerHTML="FX AMOUNT <strong>"+Math.round(fxAmount*100)+"%</strong>";return}if(fxState.drive)driveAmount(fxAmount*35);if(fxState.delay)delayWet.gain.setTargetAtTime(fxAmount*.65,ctx.currentTime,.025);fxValueOutput.textContent=Math.round(fxAmount*100)+"%";if(fxReadout)fxReadout.innerHTML="FX AMOUNT <strong>"+Math.round(fxAmount*100)+"%</strong>";}
function menuItems(){
 const menus={
 MAIN:["1:SYSTEM","2:D BEAM SETTING","3:MIDI UTILITY","4:USB AUDIO/MIDI","5:USB MASS STORAGE","6:MASTER LEVEL"],
 SYSTEM:["SYSTEM CONFIG","SYSTEM CTRL","SYSTEM INIT"],
 "SYSTEM CONFIG":["LCD CONTRAST · 07","SAMPLING GRADE · STANDARD","METRO. MODE · OFF","METRONOME LEVEL · 0","PRELOAD PTN · WRITABLE"],
 "SYSTEM CTRL":["FOOT SW ASSIGN · OFF","D BEAM SENS · 64"],
 "SYSTEM INIT":["INITIALIZE SYSTEM","RESTORE FACTORY DATA"],
 "D BEAM SETTING":["TRIGGER","SYNTH","FILTER","D BEAM SENS"],
 "MIDI UTILITY":["MIDI CHANNEL","SYNC MODE","MIDI CLOCK"],
 "USB AUDIO/MIDI":["VENDOR DRIVER · ON","USB AUDIO INPUT · OFF","USB AUDIO OUTPUT · MIX"],
 "USB MASS STORAGE":["CONNECT TO COMPUTER","DISCONNECT"],
 "MASTER LEVEL":["MASTER LEVEL · "+Math.round((master?.gain.value??.58)*127)]
 };
 return menus[menuPage]||["SELECT","VALUE"];
}
function enterSystemMenu(){
 if(!systemMenu){systemMenu=true;menuPage="MAIN";menuIndex=0;activeTab="MUESTRA";updateScreen();return}
 const selected=menuItems()[menuIndex]||"";
 if(menuPage==="MAIN"){menuPage=selected.startsWith("1:")?"SYSTEM":selected.startsWith("2:")?"D BEAM SETTING":selected.startsWith("3:")?"MIDI UTILITY":selected.startsWith("4:")?"USB AUDIO/MIDI":selected.startsWith("5:")?"USB MASS STORAGE":"MASTER LEVEL";menuIndex=0;updateScreen();return}
 if(menuPage==="SYSTEM"){menuPage=["SYSTEM CONFIG","SYSTEM CTRL","SYSTEM INIT"][menuIndex]||"SYSTEM CONFIG";menuIndex=0;updateScreen();return}
 if(menuPage==="SYSTEM CONFIG"||menuPage==="SYSTEM CTRL"){notify("VALUE EDIT · "+selected);return}
 if(menuPage==="SYSTEM INIT"){notify("INIT · CONFIRMAR CON F3");return}
 if(menuPage==="D BEAM SETTING"){notify("D BEAM · "+selected);return}
 if(menuPage==="MASTER LEVEL"){let v=Math.max(0,Math.min(1,master?.gain.value??.58));if(master)master.gain.setTargetAtTime(v,ctx.currentTime,.02);return}
 if(menuPage==="USB MASS STORAGE"){notify("USB MASS STORAGE NO DISPONIBLE EN SAFARI");return}
 notify(menuPage+" · "+selected);
}

function exitSystemMenu(){if(systemMenu){if(menuPage==="MAIN"){systemMenu=false;updateScreen()}else if(menuPage==="SYSTEM CONFIG"||menuPage==="SYSTEM CTRL"||menuPage==="SYSTEM INIT"){menuPage="SYSTEM";menuIndex=0;updateScreen()}else{menuPage="MAIN";menuIndex=0;updateScreen()}}else{activeTab="MUESTRA";updateScreen()}}
function drawValueWheel(el,label,initial,onValue,extraClass=""){let wrap=$("div","sp-dial value-encoder-wrap"),k=$("div","kb value-wheel"+(extraClass?" "+extraClass:""),"<i></i><b></b>"),caption=$("span","",label),out=$("output","",Math.round(initial*100)+"%"),v=initial,lastAngle=null;const set=x=>{v=Math.max(0,Math.min(1,x));k.firstChild.style.transform="rotate("+(-135+270*v)+"deg)";out.textContent=Math.round(v*100)+"%";onValue(v)};const angle=e=>{let r=k.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return Math.atan2(dy,dx)*180/Math.PI};k.addEventListener("pointerdown",e=>{e.preventDefault();k.setPointerCapture(e.pointerId);lastAngle=angle(e)});k.addEventListener("pointermove",e=>{if(lastAngle===null)return;let a=angle(e),d=a-lastAngle;if(d>180)d-=360;if(d< -180)d+=360;lastAngle=a;set(v+d/270)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>k.addEventListener(ev,()=>lastAngle=null));wrap.append(caption,k,out);return {wrap,set,get:()=>v,output:out};}
function setKnobValues(){if(knobSetters.length){knobSetters[1].set(padLevels[activePad]??.85);knobSetters[2].set(((padPitch[activePad]??0)/24)+.5);knobSetters[3].set(((padFilter[activePad]??18000)-300)/17700)}}
function draw(){let w=Math.max(1,Math.floor(canvas.clientWidth*2)),h=Math.max(1,Math.floor(canvas.clientHeight*2));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}let x=canvas.getContext("2d");x.clearRect(0,0,w,h);let sample=activeTab==="RECORTE"?samples[activePad]:null;if(sample){let r=ranges[activePad]||{start:0,end:1},data=sample.getChannelData(0),stride=Math.max(1,Math.floor(data.length/w));x.fillStyle="#174c12";x.fillRect(0,0,w,h);x.strokeStyle="#d8ff4f";x.lineWidth=2;x.beginPath();for(let i=0;i<w;i++){let min=1,max=-1,from=i*stride,to=Math.min(data.length,from+stride);for(let j=from;j<to;j++){min=Math.min(min,data[j]);max=Math.max(max,data[j])}let y1=h*(.5-max*.46),y2=h*(.5-min*.46);x.moveTo(i,y1);x.lineTo(i,y2)}x.stroke();let now=ctx?ctx.currentTime:0;for(let q=playbackCursors.length-1;q>=0;q--){let c=playbackCursors[q],elapsed=(now-c.at)*c.rate;if(elapsed<0)continue;if(elapsed>c.duration){playbackCursors.splice(q,1);continue}if(c.pad===activePad){let pos=Math.max(0,Math.min(1,(c.offset+elapsed)/sample.duration));let px=pos*w;x.save();x.strokeStyle="#ffffff";x.shadowColor="#d8ff4f";x.shadowBlur=14;x.lineWidth=3;x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke();x.fillStyle="#fff";x.font="bold 12px monospace";x.fillText("PLAY",Math.min(w-36,px+4),12);x.restore()}}x.fillStyle="#ff252555";x.fillRect(0,0,w*r.start,h);x.fillRect(w*r.end,0,w*(1-r.end),h);x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.moveTo(w*r.start,0);x.lineTo(w*r.start,h);x.moveTo(w*r.end,0);x.lineTo(w*r.end,h);x.stroke();x.fillStyle="#fff";x.font="bold 18px monospace";x.fillText("IN",Math.max(2,w*r.start+3),15);x.fillText("OUT",Math.min(w-38,w*r.end+3),15)}else{x.strokeStyle="#d8ff4f";x.lineWidth=2;if(analyser){let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);x.beginPath();for(let i=0;i<w;i++){let yy=h/2+(data[Math.floor(i/w*data.length)]-128)/128*h*.42;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}else{x.beginPath();for(let i=0;i<w;i++){let yy=h/2+Math.sin(i*.05)*Math.sin(i*.013)*h*.2;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}}requestAnimationFrame(draw)}
canvas.addEventListener("pointerdown",e=>{if(activeTab!=="RECORTE"||!samples[activePad])return;canvas.setPointerCapture(e.pointerId);let rect=canvas.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),r=ranges[activePad]||{start:0,end:1};trimTarget=Math.abs(p-r.start)<=Math.abs(p-r.end)?"start":"end";setTrimValue(trimTarget,p);updateScreen()});canvas.addEventListener("pointermove",e=>{if(!e.buttons||activeTab!=="RECORTE"||!samples[activePad])return;let rect=canvas.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));setTrimValue(trimTarget,p)});

loadSession();bpmText.textContent=bpm+" BPM";bankButtons.forEach(b=>b.classList.toggle("active",b.dataset.bank===activeBank));updatePadLabels();updateScreen();setKnobValues();refreshSteps();requestAnimationFrame(draw);fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);document.addEventListener("gesturestart",e=>e.preventDefault());document.addEventListener("touchmove",e=>{if(!e.target.closest(".kb,.trim-mini,.sp-dial"))e.preventDefault()},{passive:false});document.addEventListener("pointerdown",()=>{try{navigator.wakeLock?.request("screen")}catch(e){}},{once:true});
