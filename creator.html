 };

}
function enterSystemMenu(){
 if(!systemMenu){systemMenu=true;menuPage="MAIN";menuIndex=0;activeTab="MUESTRA";updateScreen();return}
 const selected=menuItems()[menuIndex]||"";
 if(menuPage==="MAIN"){menuPage=selected.startsWith("1:")?"SYSTEM":selected.startsWith("2:")?"D BEAM SETTING":selected.startsWith("3:")?"MIDI UTILITY":selected.startsWith("4:")?"USB AUDIO/MIDI":selected.startsWith("5:")?"USB MASS STORAGE":"MASTER LEVEL";menuIndex=0;updateScreen();return}

function drawValueWheel(el,label,initial,onValue,extraClass=""){let wrap=$("div","sp-dial value-encoder-wrap"),k=$("div","kb value-wheel"+(extraClass?" "+extraClass:""),"<i></i><b></b>"),caption=$("span","",label),out=$("output","",Math.round(initial*100)+"%"),v=initial,lastAngle=null;const set=x=>{v=Math.max(0,Math.min(1,x));k.firstChild.style.transform="rotate("+(-135+270*v)+"deg)";out.textContent=Math.round(v*100)+"%";onValue(v)};const angle=e=>{let r=k.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return Math.atan2(dy,dx)*180/Math.PI};k.addEventListener("pointerdown",e=>{e.preventDefault();k.setPointerCapture(e.pointerId);lastAngle=angle(e)});k.addEventListener("pointermove",e=>{if(lastAngle===null)return;let a=angle(e),d=a-lastAngle;if(d>180)d-=360;if(d< -180)d+=360;lastAngle=a;set(v+d/270)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>k.addEventListener(ev,()=>lastAngle=null));wrap.append(caption,k,out);return {wrap,set,get:()=>v,output:out};}

function draw(){let w=Math.max(1,Math.floor(canvas.clientWidth*2)),h=Math.max(1,Math.floor(canvas.clientHeight*2));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}let x=canvas.getContext("2d");x.clearRect(0,0,w,h);let sample=activeTab==="RECORTE"?samples[activePad]:null;if(sample){let r=ranges[activePad]||{start:0,end:1},data=sample.getChannelData(0),stride=Math.max(1,Math.floor(data.length/w));x.fillStyle="#174c12";x.fillRect(0,0,w,h);x.strokeStyle="#d8ff4f";x.lineWidth=2;x.beginPath();for(let i=0;i<w;i++){let min=1,max=-1,from=i*stride,to=Math.min(data.length,from+stride);for(let j=from;j<to;j++){min=Math.min(min,data[j]);max=Math.max(max,data[j])}let y1=h*(.5-max*.46),y2=h*(.5-min*.46);x.moveTo(i,y1);x.lineTo(i,y2)}x.stroke();let now=ctx?ctx.currentTime:0;for(let q=playbackCursors.length-1;q>=0;q--){let c=playbackCursors[q],elapsed=(now-c.at)*c.rate;if(elapsed<0)continue;if(elapsed>c.duration){playbackCursors.splice(q,1);continue}if(c.pad===activePad){let pos=Math.max(0,Math.min(1,(c.offset+elapsed)/sample.duration));let px=pos*w;x.save();x.strokeStyle="#ffffff";x.shadowColor="#d8ff4f";x.shadowBlur=14;x.lineWidth=3;x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke();x.fillStyle="#fff";x.font="bold 12px monospace";x.fillText("PLAY",Math.min(w-36,px+4),12);x.restore()}}x.fillStyle="#ff252555";x.fillRect(0,0,w*r.start,h);x.fillRect(w*r.end,0,w*(1-r.end),h);x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.moveTo(w*r.start,0);x.lineTo(w*r.start,h);x.moveTo(w*r.end,0);x.lineTo(w*r.end,h);x.stroke();x.fillStyle="#fff";x.font="bold 18px monospace";x.fillText("IN",Math.max(2,w*r.start+3),15);x.fillText("OUT",Math.min(w-38,w*r.end+3),15)}else{x.strokeStyle="#d8ff4f";x.lineWidth=2;if(analyser){let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);x.beginPath();for(let i=0;i<w;i++){let yy=h/2+(data[Math.floor(i/w*data.length)]-128)/128*h*.42;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}else{x.beginPath();for(let i=0;i<w;i++){let yy=h/2+Math.sin(i*.05)*Math.sin(i*.013)*h*.2;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}}requestAnimationFrame(draw)}
