<script>
const app=document.querySelector("#app");
const $=(tag,cls,html)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};
const button=(label,sub)=>{let b=$("button","",label+(sub?"<small>"+sub+"</small>":""));b.type="button";return b};
const BANKS=["A","B","C","D"];
let ctx,master,analyser,filterBus,delay,delayWet,drive,noiseBuffer;
let activePad=1,activeBank="A",activeTab="MUESTRA",bpm=96,stepIndex=0,playing=false,recording=false,looping=true,songMode=false,songPosition=0,scheduler=null,nextStepTime=0,sequenceStartTime=0,notice="";
const samples={},sampleNames={},ranges={},padLevels={},padPitch={},padFilter={},muted={},soloed={},fxState={drive:false,delay:false,filter:false};
const patternData={};
BANKS.forEach(bank=>{patternData[bank]={};for(let n=1;n<=16;n++)patternData[bank][n]=Array(16).fill(false)});
[0,4,8,12].forEach(i=>patternData.A[1][i]=true);
let songOrder=["A","B","C","D"];
function audio(){
 if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.72;filterBus=ctx.createBiquadFilter();filterBus.type="lowpass";filterBus.frequency.value=18000;filterBus.Q.value=.7;drive=ctx.createWaveShaper();drive.curve=null;drive.oversample="2x";delay=ctx.createDelay(2);delay.delayTime.value=.24;delayWet=ctx.createGain();delayWet.gain.value=0;let feedback=ctx.createGain();feedback.gain.value=.2;analyser=ctx.createAnalyser();analyser.fftSize=1024;master.connect(filterBus);filterBus.connect(drive);drive.connect(analyser);drive.connect(delay);delay.connect(delayWet);delayWet.connect(analyser);delay.connect(feedback);feedback.connect(delay);analyser.connect(ctx.destination)}
 if(ctx.state!=="running")ctx.resume();return ctx
}
function makeNoise(){if(noiseBuffer)return noiseBuffer;let c=audio(),b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noiseBuffer=b;return b}
function driveAmount(v){if(!drive)return;if(v<1){drive.curve=null;return}let a=new Float32Array(2048);for(let i=0;i<a.length;i++){let x=i*2/(a.length-1)-1;a[i]=(1+v)*x/(1+v*Math.abs(x))}drive.curve=a}
function toggleMasterFx(name,btn){audio();fxState[name]=!fxState[name];btn.classList.toggle("on",fxState[name]);if(name==="drive")driveAmount(fxState.drive?24:0);if(name==="delay")delayWet.gain.setTargetAtTime(fxState.delay?.28:0,ctx.currentTime,.025);if(name==="filter")filterBus.frequency.setTargetAtTime(fxState.filter?1200:18000,ctx.currentTime,.025)}
function padAllowed(n){let anySolo=Object.values(soloed).some(Boolean);return !muted[n]&&(!anySolo||!!soloed[n])}
function playPad(n,when){
 let c=audio(),t=when??c.currentTime;if(!padAllowed(n))return;
 let g=c.createGain(),f=c.createBiquadFilter();g.gain.value=Math.max(.001,padLevels[n]??.85);f.type="lowpass";f.frequency.value=padFilter[n]??18000;f.Q.value=.7;f.connect(g);g.connect(master);
 if(samples[n]){let src=c.createBufferSource(),r=ranges[n]||{start:0,end:1};src.buffer=samples[n];src.playbackRate.value=Math.pow(2,(padPitch[n]||0)/12);src.connect(f);let start=Math.max(0,r.start)*src.buffer.duration,end=Math.max(r.start+.02,r.end)*src.buffer.duration;src.start(t,start,Math.max(.01,end-start));src.onended=()=>{src.disconnect();f.disconnect();g.disconnect()};return}
 let o=c.createOscillator(),env=c.createGain();o.connect(env);env.connect(f);let pitch=padPitch[n]||0,base=110*Math.pow(2,(n-1)/12+pitch/12);
 if(n===1){o.type="sine";o.frequency.setValueAtTime(145*Math.pow(2,pitch/12),t);o.frequency.exponentialRampToValueAtTime(42*Math.pow(2,pitch/12),t+.28);env.gain.setValueAtTime(1,t);env.gain.exponentialRampToValueAtTime(.001,t+.34);o.start(t);o.stop(t+.36)}
 else if(n===2||n===3||n===4){let src=c.createBufferSource(),noise=makeNoise(),tone=c.createBiquadFilter();src.buffer=noise;tone.type=n===2?"bandpass":"highpass";tone.frequency.value=n===2?1900: n===3?8500:5200;src.connect(tone);tone.connect(env);env.connect(f);env.gain.setValueAtTime(n===2?.5:.35,t);env.gain.exponentialRampToValueAtTime(.001,t+(n===4?.48:.13));src.start(t);src.stop(t+(n===4?.5:.15));o.type="triangle";o.frequency.value=n===2?180:base;env.gain.setValueAtTime(.25,t);env.gain.exponentialRampToValueAtTime(.001,t+.09);o.start(t);o.stop(t+.1)}
 else{o.type=n%2?"triangle":"sawtooth";o.frequency.value=base;env.gain.setValueAtTime(.55,t);env.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24)}
 o.onended=()=>{o.disconnect();env.disconnect();f.disconnect();g.disconnect()}
}
function currentPattern(n=activePad){return patternData[activeBank][n]}
function refreshSteps(){stepGrid.querySelectorAll("button").forEach((b,i)=>{b.classList.toggle("active",!!currentPattern()[i]);b.classList.toggle("playing",playing&&i===stepIndex)})}
function updatePadLabels(){padButtons.forEach((b,i)=>{let n=i+1;b.querySelector("b").textContent=String(n).padStart(2,"0");b.querySelector("small").textContent=sampleNames[n]||"VACÍO";b.classList.toggle("on",n===activePad);b.classList.toggle("muted",!!muted[n]);b.classList.toggle("solo",!!soloed[n])})}
function setActivePad(n){activePad=n;notice="";updatePadLabels();updateScreen();refreshSteps();setKnobValues();muteButton?.classList.toggle("on",!!muted[n]);soloButton?.classList.toggle("on",!!soloed[n])}
function notify(t){notice=t;screenName.textContent=t;setTimeout(()=>{if(notice===t){notice="";updateScreen()}},1800)}
function updateScreen(){
 screenName.textContent=notice||("PAD "+String(activePad).padStart(2,"0")+" · "+(sampleNames[activePad]||"SINTETIZADOR"));
 screenTabs.replaceChildren();["MUESTRA","RECORTE","EFECTOS"].forEach(tab=>{let b=button(tab);if(tab===activeTab)b.classList.add("active");b.onclick=()=>{activeTab=tab;updateScreen()};screenTabs.append(b)});
 screenActions.replaceChildren();
 if(activeTab==="MUESTRA"){let load=button("CARGAR"),clear=button(samples[activePad]?"ELIMINAR":"BUSCAR");load.onclick=()=>file.click();clear.onclick=()=>{if(samples[activePad]){delete samples[activePad];delete sampleNames[activePad];delete ranges[activePad];updatePadLabels();updateScreen()}else file.click()};screenActions.append(load,clear)}
 if(activeTab==="RECORTE"){let r=ranges[activePad]||{start:0,end:1};[["IN","start"],["OUT","end"]].forEach(([label,key])=>{let wrap=$("label","trim-mini"),range=$("input");range.type="range";range.min=0;range.max=100;range.value=Math.round(r[key]*100);range.oninput=()=>{let v=Number(range.value)/100;if(key==="start")r.start=Math.min(v,r.end-.02);else r.end=Math.max(v,r.start+.02);ranges[activePad]=r;val.textContent=range.value+"%"};let val=$("span","",range.value+"%");wrap.append($("small","",label),range,val);screenActions.append(wrap)});let chop=button("CHOP ×4");chop.onclick=chopSample;screenActions.append(chop)}
 if(activeTab==="EFECTOS"){let rev=button("RETARDO "+(delayWet&&delayWet.gain.value>.01?"ON":"OFF"));rev.onclick=()=>{audio();delayWet.gain.setTargetAtTime(delayWet.gain.value>.01?0:.3,ctx.currentTime,.02);updateScreen()};let sat=button("DRIVE");sat.onclick=()=>{audio();driveAmount(drive.curve?0:25);sat.classList.toggle("on")};screenActions.append(rev,sat)}
}
function loadSample(f){if(!f)return;let pad=activePad;f.arrayBuffer().then(data=>audio().decodeAudioData(data)).then(buf=>{samples[pad]=buf;sampleNames[pad]=f.name.slice(0,18);ranges[pad]={start:0,end:1};updatePadLabels();updateScreen();notify("MUESTRA CARGADA EN PAD "+pad)}).catch(()=>notify("NO SE PUDO LEER EL AUDIO"))}
function chopSample(){let src=samples[activePad];if(!src){notify("CARGA UNA MUESTRA PRIMERO");return}let slots=[];for(let i=1;i<=16&&slots.length<4;i++){let n=((activePad-1+i)%16)+1;if(!samples[n])slots.push(n)}if(slots.length<4){notify("FALTAN 4 PADS VACÍOS");return}let r=ranges[activePad]||{start:0,end:1},from=Math.floor(src.length*r.start),to=Math.max(from+4,Math.floor(src.length*r.end)),span=to-from;slots.forEach((n,i)=>{let a=from+Math.floor(span*i/4),b=from+Math.floor(span*(i+1)/4),slice=audio().createBuffer(src.numberOfChannels,Math.max(1,b-a),src.sampleRate);for(let ch=0;ch<src.numberOfChannels;ch++)slice.copyToChannel(src.getChannelData(ch).slice(a,b),ch);samples[n]=slice;sampleNames[n]="CHOP "+(i+1);ranges[n]={start:0,end:1}});updatePadLabels();notify("4 CORTES CREADOS")}
function scheduleStep(){
 let beat=60/bpm/4;
 while(nextStepTime<ctx.currentTime+.12){
  for(let n=1;n<=16;n++)if(patternData[activeBank][n][stepIndex])playPad(n,nextStepTime);
  let current=stepIndex;nextStepTime+=beat;stepIndex=(stepIndex+1)%16;
  if(stepIndex===0&&songMode){songPosition=(songPosition+1)%songOrder.length;activeBank=songOrder[songPosition];bankButtons.forEach(b=>b.classList.toggle("active",b.dataset.bank===activeBank))}
  refreshSteps();
  if(stepIndex===0&&!looping){stopTransport();break}
 }
}
function startTransport(){let c=audio();if(playing)return;playing=true;stepIndex=0;sequenceStartTime=c.currentTime+.06;nextStepTime=sequenceStartTime;scheduler=setInterval(scheduleStep,20);transport.textContent="REPRODUCIENDO";playButton.textContent="PAUSA";refreshSteps()}
function stopTransport(){playing=false;recording=false;if(scheduler)clearInterval(scheduler);scheduler=null;transport.textContent="DETENIDO";playButton.textContent="PLAY";recordButton.classList.remove("on");refreshSteps()}
function toggleRecord(){audio();recording=!recording;recordButton.classList.toggle("on",recording);if(recording&&!playing)startTransport();notify(recording?"REC ARMADO · TOCA LOS PADS":"REC FINALIZADO")}
function hitPad(n){audio();setActivePad(n);playPad(n);if(recording&&playing){let beat=60/bpm/4,step=((Math.round((ctx.currentTime-sequenceStartTime)/beat)%16)+16)%16;patternData[activeBank][n][step]=true;refreshSteps()}}
function saveSession(){let data={version:1,bpm,activeBank,patterns:patternData,songOrder};try{localStorage.setItem("dirtyfingaz-zp-session",JSON.stringify(data));notify("PATRONES GUARDADOS EN ESTE DISPOSITIVO")}catch(e){notify("NO SE PUDO GUARDAR")}}
function loadSession(){try{let d=JSON.parse(localStorage.getItem("dirtyfingaz-zp-session")||"null");if(d&&d.patterns){BANKS.forEach(bank=>{if(d.patterns[bank])for(let n=1;n<=16;n++)if(d.patterns[bank][n])patternData[bank][n]=d.patterns[bank][n]});bpm=d.bpm||96;activeBank=BANKS.includes(d.activeBank)?d.activeBank:"A";songOrder=d.songOrder||songOrder}}catch(e){}}
function exportWav(){
