 const k=mk('div','k','<label>'+n+'</label>'),kb=mk('div','knob','<i></i>');k.append(kb,mk('div','sub',s));$('#kn').append(k);bindKnob(kb)});
function bindKnob(el,inf){let a=0,y0=0,a0=0,on=0,lx=0,ly=0;const set=v=>{a=inf?v:Math.max(-135,Math.min(135,v));el.style.setProperty('--r',a+'deg')};
 el.addEventListener('pointerdown',e=>{on=1;y0=e.clientY;lx=e.clientX;ly=e.clientY;a0=a;el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!on)return;if(inf){set(a+((e.clientX-lx)-(e.clientY-ly))*1.25);lx=e.clientX;ly=e.clientY}else set(a0+(y0-e.clientY)*2.2)});
 const up=()=>on=0;el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
/* botones */
const B=(t,cls)=>{const b=mk('div','b '+(cls||''),t);return b};
['FILTER<br>DRIVE','RESONATOR','DELAY'].forEach(t=>$('#cl').append(B(t)));
['ISOLATOR','DJFX<br>LOOPER','MFX'].forEach(t=>$('#cr').append(B(t)));
function row(cols,tags,btns,cls){const w=mk('div');const tg=mk('div','row tg');tg.style.gridTemplateColumns=cols;
 tags.forEach(([t,n])=>{const s=mk('span','',t);s.style.gridColumn='span '+n;tg.append(s)});
 const r=mk('div','row '+(cls||''));r.style.gridTemplateColumns=cols;
 btns.forEach(b=>{if(typeof b==='string'){const x=B(b);r.append(x)}else r.append(b)});w.append(tg,r);$('#rows').append(w);return r}
const pe=mk('div','knob pe','<i></i>');bindKnob(pe,1);
row('repeat(6,1fr) 70px',[['PATTERN SEQUENCER',3],['SAMPLE EDIT',3],['PUSH ENTER',1]],
 ['PATTERN<br>SELECT','PATTERN<br>EDIT','RECORD<br>SETTING','START/<br>END','PITCH<br>SPEED','MARK',pe],'big ra');
row('repeat(8,1fr)',[['UNDO',1],['SAMPLING',2],['CHOP',1],['ENVELOPE',2],['SAMPLE MODE',2]],
 ['DEL','REC','RESAMPLE','BPM<br>SYNC','GATE','LOOP','REVERSE','ROLL'],'big');
row('repeat(9,1fr)',[['',6],['BANK',2],['ROLL SET',1]],
 ['EXIT','COPY','REMAIN','A/F','B/G','C/H','D/I','E/J','SHIFT'],'big');
/* estados fijos como en la imagen */
const all=[...document.querySelectorAll('#rows .b')];const by=t=>all.find(b=>b.textContent.replace(/\s/g,'')===t.replace(/\s/g,''));
by('REC').classList.add('lit');by('A/F').classList.add('lit');
const bank=['A/F','B/G','C/H','D/I','E/J'].map(by);
bank.forEach(b=>b.addEventListener('click',()=>{bank.forEach(x=>x.classList.remove('lit'));b.classList.add('lit')}));
['REC','SHIFT'].forEach(t=>by(t).addEventListener('click',e=>e.currentTarget.classList.toggle('lit')));
/* pads: multitouch real, luz al sonar */
const held=new Map();
for(let i=0;i<9;i++)$('#pads').append(mk('div','p'));
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.p,.b');if(!t)return;t.classList.add('on');held.set(e.pointerId,t)});
const rel=e=>{const t=held.get(e.pointerId);if(t){t.classList.remove('on');held.delete(e.pointerId)}};
document.addEventListener('pointerup',rel);document.addEventListener('pointercancel',rel);
/* fila inferior */
$('#bt').append(mk('i','screw'));['UTILITY','IMPORT/EXPORT','PAD SETTING','EFX SETTING','PROJECT'].forEach(t=>$('#bt').append(B(t)));$('#bt').append(mk('i','screw'));
/* waveform real + recorte IN/OUT táctil */
let trimState=null,activeTrimTarget="start",trimPointer=false;
function wave(){const c=$('#wv'),x=c.getContext('2d'),w=168,h=46;x.clearRect(0,0,w,h);const lcd=getComputedStyle(unit).getPropertyValue('--lcd').trim();x.fillStyle="#001000";x.fillRect(0,0,w,h);
 if(trimState&&trimState.waveform&&trimState.waveform.length){x.fillStyle=lcd;const data=trimState.waveform;for(let i=0;i<data.length;i++){const xx=i*w/data.length,lo=data[i][0],hi=data[i][1],y1=h*(.5-hi*.46),y2=h*(.5-lo*.46);x.fillRect(xx,y1,Math.max(1,w/data.length-0.5),Math.max(1,y2-y1))}}
 else{x.fillStyle=lcd;for(let i=0;i<40;i++){const p=i%10,env=Math.exp(-p/3)*(p?1:.5),bar=Math.max(2,Math.round(21*env*(.7+.3*Math.abs(Math.sin(i*2.3)))/2)*2);x.fillRect(4+i*4,23-bar,3,bar*2)}}
 if(trimState){const r=trimState.range||{start:0,end:1},a=Math.max(0,Math.min(1,r.start)),b=Math.max(a,Math.min(1,r.end));x.fillStyle="#ff343455";x.fillRect(0,0,w*a,h);x.fillRect(w*b,0,w*(1-b),h);x.strokeStyle="#fff";x.lineWidth=1.5;x.beginPath();x.moveTo(w*a,0);x.lineTo(w*a,h);x.moveTo(w*b,0);x.lineTo(w*b,h);x.stroke();x.fillStyle="#fff";x.font="8px monospace";x.fillText("IN",Math.min(w-18,w*a+2),8);x.fillText("OUT",Math.max(2,Math.min(w-20,w*b+2)),h-2)}
 x.strokeStyle=lcd;x.globalAlpha=.55;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();x.globalAlpha=1}
wave();
const waveCanvas=$('#wv');
function trimPosition(e){const r=waveCanvas.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
function sendTrim(e,commit){zpBridgeSend("creator.sample.trim.set",{target:activeTrimTarget,position:trimPosition(e),commit:!!commit})}
waveCanvas.addEventListener("pointerdown",e=>{e.preventDefault();trimPointer=true;waveCanvas.setPointerCapture(e.pointerId);sendTrim(e,false)});
waveCanvas.addEventListener("pointermove",e=>{if(trimPointer)sendTrim(e,false)});
["pointerup","pointercancel","lostpointercapture"].forEach(type=>waveCanvas.addEventListener(type,e=>{if(trimPointer){trimPointer=false;sendTrim(e,true)}}));
window.addEventListener("message",e=>{const d=e.data;if(e.source!==document.getElementById("zp-engine")?.contentWindow||e.origin!==location.origin||!d||d.type!=="zp-engine-trim-state"||d.protocolVersion!==1||d.source!=="creator.engine")return;trimState=d;wave()});
window.addEventListener("zp-engine-result",e=>{const d=e.detail?.result?.data;if(d?.target==="start"||d?.target==="end")activeTrimTarget=d.target});

requestAnimationFrame(()=>requestAnimationFrame(fit));
/* temas: toca MENU */
const skins=['verde','ambar','cian','rojo'];
$('#menu').addEventListener('click',()=>{unit.dataset.skin=skins[(skins.indexOf(unit.dataset.skin)+1)%4];wave()});
/* piano roll: botón PATTERN EDIT */
const gr=$('#gr');gr.append(mk('em',''));for(let s=1;s<=16;s++)gr.append(mk('em','',s));
for(let l=1;l<=9;l++){gr.append(mk('em','',l));for(let s=0;s<16;s++){const c=mk('div','c');c.dataset.s=s;gr.append(c)}}
gr.addEventListener('click',e=>{if(e.target.classList.contains('c'))e.target.classList.toggle('on')});
const pb=by('PATTERNEDIT');pb.addEventListener('click',()=>{scr.classList.toggle('pr');pb.classList.toggle('lit',scr.classList.contains('pr'))});
let tm=null,st=0;const cells=()=>[...gr.querySelectorAll('.c')];
$('#play').addEventListener('click',()=>{const p=$('#play');
 if(tm){clearInterval(tm);tm=null;p.innerHTML='&#9654; PLAY';cells().forEach(c=>c.classList.remove('hd2'))}
 else{p.innerHTML='&#9632; STOP';st=0;tm=setInterval(()=>{cells().forEach(c=>c.classList.toggle('hd2',+c.dataset.s===st));st=(st+1)%9},125)}});
const lens=['1/16','1/8','1/4'];$('#len').addEventListener('click',e=>{const t=e.currentTarget;t.textContent='LEN:'+lens[(lens.indexOf(t.textContent.slice(4))+1)%3]});
document.querySelectorAll('.tg span').forEach(s=>{const t=s.textContent;if(['UNDO','CHOP','ENVELOPE','PUSH ENTER'].includes(t))s.classList.add('pl');else if(['PATTERN SEQUENCER','SAMPLING'].includes(t))s.classList.add('tr');else if(t)s.classList.add('tl')});
/* shader: toca el título para alternar 8-bit / TV / apagado */

</script>

<iframe id="zp-engine" src="./creator-engine.html" title="DIRTYFINGAZ ZP audio engine" aria-hidden="true"></iframe>
<script>
(()=>{
 const frame=document.getElementById("zp-engine");
 let ready=false,sequence=0;const queue=[],pending=new Map();
 const dispatch=(type,detail)=>window.dispatchEvent(new CustomEvent(type,{detail}));
 const sendPacket=packet=>{if(!frame.contentWindow){pending.delete(packet.requestId);return}frame.contentWindow.postMessage(packet,location.origin)};
 window.zpBridgeSend=(command,payload={})=>{
  if(typeof command!=="string"||!command.startsWith("creator."))throw new TypeError("Comando Creator inválido");
  const requestId="creator-ui-"+(++sequence)+"-"+Date.now();
  const packet={type:"zp-engine-command",protocolVersion:1,source:"creator.ui",timestamp:Date.now(),requestId,command,payload:payload&&typeof payload==="object"?payload:{}};
  const timer=setTimeout(()=>{if(pending.has(requestId)){pending.delete(requestId);dispatch("zp-engine-timeout",{requestId,command})}},8000);
  pending.set(requestId,{command,timer});
  if(ready)sendPacket(packet);else queue.push(packet);
  return requestId;
 };
 window.addEventListener("message",ev=>{
  if(ev.source!==frame.contentWindow||ev.origin!==location.origin||!ev.data)return;
  const data=ev.data;
  if(data.type==="zp-engine-ready"&&data.protocolVersion===1){ready=true;while(queue.length)sendPacket(queue.shift());dispatch("zp-engine-ready",data);return}
  if(data.type==="zp-engine-ack"||data.type==="zp-engine-error"){
   const item=pending.get(data.requestId);
   if(item){clearTimeout(item.timer);pending.delete(data.requestId)}
   dispatch(data.type==="zp-engine-ack"?"zp-engine-result":"zp-engine-error",data);
   if(data.type==="zp-engine-error")console.error("Creator engine:",data.command,data.error||data.message);
  }
 });
 window.addEventListener("message",ev=>{const d=ev.data;if(ev.source!==frame.contentWindow||ev.origin!==location.origin||!d||d.type!=="zp-engine-playhead"||d.protocolVersion!==1||d.source!=="creator.engine")return;document.querySelectorAll("#gr .c").forEach(cell=>{const row=cell.parentElement,rowIndex=[...grid.children].indexOf(row),padId=Math.max(1,Math.min(9,Math.floor((rowIndex-17)/17)+1));cell.classList.toggle("hd2",padId===d.activePad&&Number(cell.dataset.s)===d.step)});});
 window.addEventListener("zp-engine-timeout",ev=>console.error("Creator engine timeout:",ev.detail.command));
 window.addEventListener("zp-engine-error",ev=>console.error("Creator engine error:",ev.detail.command,ev.detail.error||ev.detail.message));
 window.addEventListener("zp-engine-result",ev=>{if(ev.detail.result?.ok===false)console.error("Creator command failed:",ev.detail.command,ev.detail.result.error)});

 const norm=s=>(s||"").replace(/<[^>]*>/g,"").replace(/\s+/g,"").toUpperCase();
 const allButtons=()=>[...document.querySelectorAll("#rows .b,#bt .b,#cl .b,#cr .b")];
 const bind=(label,fn)=>{
  const key=norm(label);
  allButtons().filter(el=>norm(el.textContent)===key).forEach(el=>el.addEventListener("click",fn));
 };
 /* Pads: nueve superficies limpias, conectadas al motor real */
 document.querySelectorAll("#pads .p").forEach((pad,i)=>{
  pad.setAttribute("aria-label","Pad "+(i+1));
  pad.addEventListener("pointerdown",()=>zpBridgeSend("creator.pad.trigger",{padId:i+1}));
 });
 /* Transporte real, sin el temporizador visual de demostración */
 const oldPlay=document.getElementById("play");
 if(oldPlay){const play=oldPlay.cloneNode(true);oldPlay.replaceWith(play);play.addEventListener("click",()=>zpBridgeSend("creator.transport.toggle"));}
 bind("REC",()=>zpBridgeSend("creator.record.toggle"));
 bind("RECORDSETTING",()=>zpBridgeSend("creator.record.toggle"));
 document.querySelectorAll(".tg span").forEach(tag=>{const label=norm(tag.textContent);if(label==="CHOP")tag.addEventListener("click",()=>zpBridgeSend("creator.sample.chop"));if(label==="SAMPLEEDIT")tag.addEventListener("click",()=>zpBridgeSend("creator.sample.load.request"));});
 
 
 bind("DEL",()=>zpBridgeSend("creator.sample.clear"));
 bind("LOOP",()=>zpBridgeSend("creator.loop.toggle"));
 bind("DJFXLOOPER",()=>zpBridgeSend("creator.loop.toggle"));
 bind("PROJECT",()=>zpBridgeSend("creator.project.manager.open"));
 bind("UTILITY",()=>zpBridgeSend("creator.export.wav"));
 bind("IMPORT/EXPORT",()=>zpBridgeSend("creator.sample.load.request"));
 bind("PADSETTING",()=>zpBridgeSend("creator.pad.mute.toggle"));
 bind("EFXSETTING",()=>zpBridgeSend("creator.fx.master.toggle",{name:"drive"}));
 bind("FILTERDRIVE",()=>zpBridgeSend("creator.fx.master.toggle",{name:"drive"}));
 bind("RESONATOR",()=>zpBridgeSend("creator.fx.master.toggle",{name:"filter"}));
 bind("ISOLATOR",()=>zpBridgeSend("creator.fx.master.toggle",{name:"filter"}));
 bind("DELAY",()=>zpBridgeSend("creator.fx.master.toggle",{name:"delay"}));
 bind("MFX",()=>zpBridgeSend("creator.fx.master.toggle",{name:"drive"}));
 bind("START/END",()=>zpBridgeSend("creator.sample.trim.target.toggle"));
 /* Selector de bancos A-D */
 ["A/F","B/G","C/H","D/I"].forEach((label,i)=>bind(label,()=>zpBridgeSend("creator.pattern.select",{bank:["A","B","C","D"][i]})));
 bind("PATTERNSELECT",()=>{
  const banks=["A","B","C","D"],active=document.querySelector("#rows .b.lit");
  const next=banks[(Math.max(0,banks.indexOf((active?.textContent||"A/F").charAt(0)))+1)%4];
  zpBridgeSend("creator.pattern.select",{bank:next});
 });
 /* Piano roll 9x9: filas seleccionan pad y columnas activan pasos reales */
 const grid=document.getElementById("gr");
 if(grid)grid.addEventListener("click",ev=>{
  const cell=ev.target.closest(".c");if(!cell)return;
  const row=cell.parentElement,children=[...grid.children],index=children.indexOf(row);
  const padId=Math.max(1,Math.min(9,Math.floor((index-17)/17)+1));
  const step=Math.max(0,Math.min(15,Number(cell.dataset.s)||0));
  zpBridgeSend("creator.pad.select",{padId});
  zpBridgeSend("creator.pattern.step.toggle",{step});
 });
 /* Cuatro knobs: volumen maestro, cutoff, resonancia y drive */
 const knobNames=["master","cutoff","resonance","drive"];
 document.querySelectorAll("#kn .knob").forEach((knob,i)=>{
  let last=-999;
  knob.addEventListener("pointermove",()=>{
   const raw=getComputedStyle(knob).getPropertyValue("--r").trim();
   const angle=parseFloat(raw)||0,v=Math.max(0,Math.min(1,(angle+135)/270));
   if(Math.abs(v-last)>.008){last=v;zpBridgeSend("creator.control.set",{name:knobNames[i],value:v});}
  });
 });
 const valueEncoder=document.querySelector(".pe");
 if(valueEncoder)valueEncoder.addEventListener("pointermove",()=>{
  const angle=parseFloat(getComputedStyle(valueEncoder).getPropertyValue("--r"))||0;
  zpBridgeSend("creator.control.set",{name:"fx-amount",value:Math.max(0,Math.min(1,(angle+135)/270))});
 });
 /* Salida al hub ZP */
 const goHome=()=>parent.postMessage({type:"zp-exit-creator",source:"creator.ui",timestamp:Date.now()} ,location.origin);
 document.getElementById("creator-home")?.addEventListener("click",goHome);
 bind("EXIT",goHome);
})();
</script>
