name: Deploy DIRTYFINGAZ ZP 1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site files only
        run: |
          set -euo pipefail
          mkdir -p _site/vendor
          cp index.html creator.html creator-engine.html sw.js manifest.webmanifest \
             zp-config.js zp-core.js zp-storage.js zp-agent.js zp-agent-registry.json \
             zp-layout.js zp-layout.css zp-ui-system.css zp-agent.css zp-icon.svg _site/
          cp vendor/lame.min.js _site/vendor/
          touch _site/.nojekyll
      - name: Verify every precached file is in the staged site
        run: |
          node -e '
            const fs = require("fs");
            const core = fs.readFileSync("sw.js", "utf8").match(/const CORE=\[(.*?)\];/s)[1]
              .split(",").map(x => x.trim().replace(/^.\.\//, "").replace(/.$/, "")).filter(x => x && x !== ".");
            const missing = core.filter(f => !fs.existsSync("_site/" + f));
            if (missing.length) { console.error("Faltan en _site:", missing); process.exit(1); }
            console.log("OK: " + core.length + " archivos del service worker presentes en _site.");
          '
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
