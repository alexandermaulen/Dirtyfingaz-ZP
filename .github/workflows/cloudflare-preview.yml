name: DIRTYFINGAZ ZP Cloudflare Preview

on:
  push:
    branches:
      - "feat/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirtyfingaz-zp-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and publish isolated Worker Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project contracts
        run: node scripts/validate.mjs

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "reason=missing-token" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare Account ID, not an API token."
            echo "reason=invalid-account-id" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "reason=ready" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish isolated Cloudflare Worker Preview
        if: steps.credentials.outputs.ready == 'true'
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_NAME="dirtyfingaz-zp-preview"
          npx --yes wrangler@4.135.0 deploy --config wrangler.preview.jsonc --name "$PREVIEW_NAME" 2>&1 | tee deploy-output.log
          PREVIEW_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' deploy-output.log | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Wrangler deployed without returning a workers.dev URL."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## DIRTYFINGAZ ZP Preview"
            echo
            echo "Preview URL: $PREVIEW_URL"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Isolated Worker: $PREVIEW_NAME"
            echo "Production Worker remains untouched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report missing credentials
        if: steps.credentials.outputs.ready != 'true'
        env:
          REASON: ${{ steps.credentials.outputs.reason }}
        run: |
          {
            echo "## Cloudflare Preview pendiente"
            echo
            if [ "$REASON" = "invalid-account-id" ]; then
              echo "CLOUDFLARE_ACCOUNT_ID debe ser el Account ID de 32 caracteres hexadecimales de Cloudflare Dashboard > Workers & Pages > Overview. No pegues aquí el API Token."
            elif [ "$REASON" = "missing-token" ]; then
              echo "Falta CLOUDFLARE_API_TOKEN en Repository secrets."
            else
              echo "Revisa CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Repository secrets."
            fi
            echo
            echo "La validación de código sí se ejecutó. No se desplegó Preview."
          } >> "$GITHUB_STEP_SUMMARY"
