name: DIRTYFINGAZ ZP validation only (Pages mission)

on:
  push:
    branches:
      - "feat/mission-anchor-pages-main"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application before GitHub Pages merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project contracts
        run: node scripts/validate.mjs
      - name: Confirm canonical deployment policy
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('.github/agent-policy.json', 'utf8'));
          if (p.mission_anchor?.canonical_application_url !== 'https://alexandermaulen.github.io/Dirtyfingaz-ZP/') throw new Error('Canonical URL mismatch');
          if (p.deployment_policy?.target !== 'GitHub Pages') throw new Error('Deployment target mismatch');
          if (p.deployment_policy?.preview !== 'disabled') throw new Error('Preview must remain disabled');
          if (p.operating_branch !== 'feat/mission-anchor-pages-main') throw new Error('Mission branch mismatch');
          console.log('Mission anchor: PASS');
          NODE
