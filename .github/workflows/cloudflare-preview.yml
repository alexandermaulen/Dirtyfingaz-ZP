name: DIRTYFINGAZ ZP Cloudflare Preview

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirtyfingaz-zp-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish isolated Cloudflare Worker Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Validate project contracts
        run: node scripts/validate.mjs

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_NAME="dirtyfingaz-zp-preview"
          npx --yes wrangler@4.135.0 deploy --name "$PREVIEW_NAME" --var ENVIRONMENT:preview --var AI_AGENT_ENABLED:true

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## DIRTYFINGAZ ZP Preview"
            echo
            echo "Worker: dirtyfingaz-zp-preview"
            echo "This is an isolated preview deployment. Production Worker was not modified."
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
